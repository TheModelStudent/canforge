# canforge simulator: a small powertrain that tells a coherent story.
bus vcan0 500000

database powertrain.dbc

plant
  mass 1500kg
  wheel_radius 0.32
  final_drive 3.9
  gear_ratios 3.5 2.1 1.4 1.0 0.8
  idle_rpm 800
  max_rpm 6500
  peak_torque 250

drive
  at 0s   throttle 0 brake 0 gear 1
  at 2s   throttle 60
  at 12s  throttle 35 gear 2
  at 22s  throttle 80 gear 3
  at 34s  throttle 0 brake 25
  at 42s  throttle 0 brake 0

node ECM
  tx EngineData cycle 10ms jitter 500us
    signal EngineSpeed        = plant.engine_rpm
    signal EngineCoolantTemp  = plant.coolant_temp_c
    signal ThrottlePosition   = plant.throttle_pct
    signal EngineTorque       = plant.engine_torque_nm
    signal FuelRate           = plant.fuel_rate_lph
    signal IdleActive         = square low 0 high 1 period 4s duty 0.25

  tx EngineControl1 cycle 20ms phase 3ms
    signal EngineSpeedJ1939     = plant.engine_rpm
    signal DriversDemandTorque  = plant.throttle_pct

node TCM
  tx TransmissionData cycle 20ms jitter 1ms phase 5ms
    signal GearActual       = plant.gear
    signal GearTarget       = plant.gear
    signal OutputShaftSpeed = plant.wheel_rpm
    signal OilTemperature   = ramp 20 to 95 over 120s
    signal TorqueRequest    = plant.engine_torque_nm

node ABS
  tx WheelSpeeds cycle 20ms phase 7ms
    signal WheelBasedSpeed     = plant.speed_kmh
    signal ParkingBrake        = const 0
    signal CruiseControlActive = const 0

fault dropsome     drop 0.05 node ABS
fault lagbox       delay 40ms node TCM
fault stuck_rpm    freeze EngineSpeed node ECM
fault silly_speed  range WheelBasedSpeed 255 node ABS
fault ecm_offline  stop node ECM
fault noise        bitflip 0.01 node ABS
